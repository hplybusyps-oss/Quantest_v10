<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>[Quantest] 퀀트 백테스트</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.9.2/build/stlite.css">
  <style>
    body { margin: 0; background: #fff; }
    #boot {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; font: 15px "Malgun Gothic", system-ui, sans-serif; color: #444; background: #fff; z-index: 10;
      padding: 16px; text-align: center;
    }
    #boot small { color: #888; }
    #ghPanel {
      position: fixed; right: 16px; top: 64px; z-index: 2147483000; width: min(320px, calc(100vw - 32px));
      background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.12);
      font: 13px "Malgun Gothic", system-ui, sans-serif; color: #333;
    }
    #ghPanel b { display: block; margin-bottom: 8px; font-size: 14px; }
    #ghPanel input { width: 100%; box-sizing: border-box; padding: 7px 9px; border: 1px solid #ccc; border-radius: 6px; font: inherit; }
    #ghPanel .row { display: flex; gap: 6px; margin-top: 8px; }
    #ghPanel button { flex: 1; padding: 7px; border-radius: 6px; border: 1px solid #ccc; background: #fff; font: inherit; cursor: pointer; }
    #ghPanel button.primary { background: #ff4b4b; border-color: #ff4b4b; color: #fff; }
    #ghPanel small { display: block; margin-top: 8px; color: #777; line-height: 1.5; }
  </style>
</head>
<body>
  <div id="boot">
    <div>📈 Quantest 불러오는 중...</div>
    <small>브라우저에서 Python 을 실행합니다. 첫 방문은 20~40초, 이후에는 더 빨리 열립니다.</small>
  </div>
  <div id="root"></div>
  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.9.2/build/stlite.js";

    // GitHub 토큰은 이 브라우저의 localStorage 에만 저장하고, 앱 시작 시 Python 에 환경변수로 전달
    const TOKEN_KEY = "quantest.githubToken";
    let token = "";
    try { token = localStorage.getItem(TOKEN_KEY) || ""; } catch { /* 저장소 차단 */ }
    // 마지막 사이드바 설정 (앱이 설정을 바꿀 때마다 저장) → 시작 시 복원
    let lastConfig = "";
    try { lastConfig = localStorage.getItem("quantest.lastConfig") || ""; } catch { /* 저장소 차단 */ }

    const v = "__BUILD_ID__";   // 배포마다 바뀜 → 브라우저 캐시 무효화
    mount(
      {
        requirements: ["matplotlib", "plotly"],
        entrypoint: "Quantest_v10.py",
        files: {
          "Quantest_v10.py": { url: `./Quantest_v10.py?v=${v}` },
          "Stock_list.csv":  { url: `./Stock_list.csv?v=${v}` },
          "prices.csv":      { url: `./prices.csv?v=${v}` },
          "NanumGothic.ttf": { url: "./NanumGothic.ttf" },
        },
        env: { GITHUB_TOKEN: token, QUANTEST_LAST_CONFIG: lastConfig },
      },
      document.getElementById("root"),
    );

    // 주소에 ?gh 가 있을 때만 토큰 입력 칸 표시
    if (new URLSearchParams(location.search).has("gh")) {
      const panel = document.createElement("div");
      panel.id = "ghPanel";
      panel.innerHTML = `
        <b>GitHub 토큰 ${token ? "<span style='color:#1b5e20'>● 연결됨</span>" : ""}</b>
        <input type="password" id="ghTok" placeholder="${token ? "저장됨 — 바꾸려면 새 토큰 입력" : "github_pat_..."}" autocomplete="off">
        <div class="row">
          <button class="primary" id="ghSave">저장</button>
          ${token ? '<button id="ghDel">연결 해제</button>' : ""}
          <button id="ghClose">닫기</button>
        </div>
        <small>토큰은 이 브라우저에만 저장됩니다. 저장하면 페이지가 다시 열리고, 사이드바 'GitHub 연결'에서 확인할 수 있습니다.</small>`;
      document.body.appendChild(panel);
      const store = val => {
        try { val ? localStorage.setItem(TOKEN_KEY, val) : localStorage.removeItem(TOKEN_KEY); location.reload(); }
        catch { alert("이 브라우저는 저장소를 차단했습니다"); }
      };
      panel.querySelector("#ghSave").onclick = () => {
        const val = panel.querySelector("#ghTok").value.trim();
        if (val) store(val);
      };
      panel.querySelector("#ghDel")?.addEventListener("click", () => store(""));
      panel.querySelector("#ghClose").onclick = () => panel.remove();
    }

    // Streamlit 화면이 그려지면 안내 문구 제거
    const hide = () => document.getElementById("boot")?.remove();
    new MutationObserver((_, obs) => {
      if (document.querySelector('[data-testid="stSidebar"], [data-testid="stAppViewContainer"]')) { hide(); obs.disconnect(); }
    }).observe(document.getElementById("root"), { childList: true, subtree: true });
    setTimeout(hide, 90000);
  </script>
</body>
</html>
